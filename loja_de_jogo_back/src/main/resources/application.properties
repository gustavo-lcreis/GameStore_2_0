# loja_de_jogo_back/src/main/resources/application.properties
spring.application.name=pi-3
server.port=8080

# H2 em ARQUIVO (persiste entre restarts)
spring.datasource.url=jdbc:h2:file:./data/gamestoredb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# update: mantém os dados e só ajusta o schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- Upload de imagens ----
# Pasta física dos .jpg/.jpeg (relativa ao diretório de execução).
# Em produção aponte para fora do projeto, ex.: /var/gamestore/assets/jogos
app.upload.dir=./src/main/resources/static/assets/jogos

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
# folga para os campos de texto do formulário, que vão no mesmo request
spring.servlet.multipart.max-request-size=6MB
# deixa o 413 chegar ao navegador com a mensagem, em vez de a conexão ser derrubada
server.tomcat.max-swallow-size=20MB

# Logs
logging.level.br.com.gamestore.pi_3=DEBUG
# ---- Autenticação ----
# Validade do token de login (as sessões ficam em memória e somem ao reiniciar)
app.auth.token-ttl-hours=8
